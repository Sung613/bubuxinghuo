<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>星火跃迁 · 团日极客挑战赛</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 920px;
            background: #121720;
            border-left: 1px solid #263042;
            border-right: 1px solid #263042;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 700;
            pointer-events: none;
            z-index: 6;
        }

        .hud-pill {
            background: rgba(13, 17, 23, 0.78);
            border: 1px solid rgba(139, 148, 158, 0.25);
            backdrop-filter: blur(6px);
            padding: 6px 12px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sound-btn {
            pointer-events: auto;
            width: auto;
            padding: 6px 10px;
            margin: 0;
            font-size: 13px;
            border-radius: 999px;
            background: rgba(33, 38, 45, 0.9);
            border: 1px solid #30363d;
        }

        #milestone-banner {
            position: absolute;
            top: 62px;
            left: 50%;
            transform: translate(-50%, -20px);
            background: linear-gradient(90deg, rgba(218, 54, 51, 0.95), rgba(245, 158, 11, 0.95));
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            padding: 7px 18px;
            border-radius: 999px;
            box-shadow: 0 6px 20px rgba(218, 54, 51, 0.45);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 7;
            white-space: nowrap;
        }

        #milestone-banner.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 22, 0.93);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #ff5555;
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 0 14px rgba(255, 85, 85, 0.45);
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        input {
            width: 84%;
            padding: 12px 14px;
            font-size: 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 14px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #ff5555;
        }

        button {
            width: 84%;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            background: #da3633;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: transform 0.1s ease, background 0.15s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.85;
            cursor: default;
        }

        button.secondary {
            background: #21262d;
            border: 1px solid #30363d;
            font-weight: 600;
        }

        .quiz-box {
            background: #161b22;
            border: 1px solid #f59e0b;
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-height: 78vh;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .quiz-q {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.45;
        }

        .quiz-opt {
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            font-weight: 500;
            font-size: 14px;
        }

        .quiz-opt.correct {
            background: rgba(63, 185, 80, 0.22);
            border-color: #3fb950;
            color: #7ee787;
        }

        .quiz-opt.wrong {
            background: rgba(248, 81, 73, 0.22);
            border-color: #f85149;
            color: #ffa198;
        }

        .quiz-explain {
            display: none;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            font-size: 13px;
            line-height: 1.55;
            color: #e6edf3;
            text-align: left;

        .rank-list {

            overflow-y: auto;
            background: #0d1117;
            border-radius: 8px;

        }

            color: #ffd700;
            font-weight: 700;
        }

        .rank-item:nth-child(2) {
            color: #d0d7de;
            font-weight: 700;
        }

        .rank-item:nth-child(3) {
            color: #d97706;
            font-weight: 700;
        }

            position: absolute;
            bottom: 16px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: rgba(255, 255, 255, 0.34);
            font-size: 12px;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="hud">
            <div class="hud-pill">
                <span>高度 <strong id="score-display" style="color:#ff5555">0</strong>m</span>

            <p class="subtitle">开局慢速热身，随高度逐步加速！<br>左右点击变道躲避掉落异常，冲刺更高里程碑。</p>
            <input type="text" id="username" placeholder="输入姓名 / 学号后四位" maxlength="10" autocomplete="off">

        </div>

    <script>
        // ================= 纯 JS 音效引擎 (Web Audio API) =================
        const SoundFX = (() => {
            let ctx = null;
            let muted = false;

            function ensureCtx() {
                if (muted) return null;
                if (!ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) ctx = new AudioContext();
                }
                if (ctx && ctx.state === 'suspended') {
                    ctx.resume().catch(() => { });
                }
                return ctx;
            }

            function playTone(freq, duration, type = 'sine', gainVal = 0.12, delay = 0, endFreq = null) {
                const c = ensureCtx();
                if (!c) return;
                const now = c.currentTime + delay;
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.linearRampToValueAtTime(gainVal, now + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(c.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            }

            return {
                jump(lane) {
                    const base = 360 + lane * 65;
                    playTone(base, 0.09, 'triangle', 0.11, 0, base * 1.35);
                },
                warn() {
                    playTone(740, 0.07, 'square', 0.04, 0);
                },
                milestone() {
                    playTone(523.25, 0.12, 'triangle', 0.13, 0);
                    playTone(659.25, 0.12, 'triangle', 0.13, 0.09);
                    playTone(783.99, 0.22, 'triangle', 0.14, 0.18);
                },
                hit() {
                    playTone(210, 0.24, 'sawtooth', 0.13, 0, 75);
                },
                revive() {
                    playTone(440, 0.1, 'sine', 0.12, 0, 660);
                    playTone(660, 0.16, 'sine', 0.12, 0.09, 880);
                },
                setMuted(v) {
                    muted = v;
                },
                isMuted() {
                    return muted;
                }
            };
        })();

        function toggleMute() {
            const next = !SoundFX.isMuted();
            SoundFX.setMuted(next);
            document.getElementById('sound-btn').innerText = next ? '🔇 已静音' : '🔊 音效开';
        }

        // ================= 里程碑、速度曲线与题库配置 =================
        const MILESTONES = [
            { height: 100, title: '🔥 100m 星火初燃 · 青年启航' },

        ];

        function getSpeedMultiplier(currentScore) {
            const progress = 1 - Math.exp(-Math.max(0, currentScore) / 650);
            return 0.82 + progress * 1.1;
        }

        function getSpawnInterval(currentScore) {
            const progress = 1 - Math.exp(-Math.max(0, currentScore) / 550);
            return Math.round(74 - progress * 48);
        }

        function getWarnDuration(currentScore) {
            const progress = 1 - Math.exp(-Math.max(0, currentScore) / 600);
            return Math.round(52 - progress * 24);
        }

            },

                opts: ["增强多样性并加快收敛", "必然导致死锁", "只能串行执行", "无法交换信息"],
                ans: 0,

        const OBSTACLE_TYPES = [
            { label: '404', color: '#da3633', speedMult: 1.0, width: 56, wobble: 0 },
            { label: 'BUG', color: '#d97706', speedMult: 1.15, width: 58, wobble: 1.6 },
            { label: 'OOM', color: '#be123c', speedMult: 1.32, width: 56, wobble: 0 },
            { label: 'LOOP', color: '#9333ea', speedMult: 0.94, width: 72, wobble: 0 }
        ];

        // ================= 游戏核心状态 =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const LANES = 3;

        let W = 0, H = 0;
        let laneWidth = 0;
        let player = {
            lane: 1,
            x: 0,
            targetX: 0,
            y: 0,
            scale: 1,
            lastJumpAt: 0,
            invulnUntil: 0
        };

        let score = 0;
        let username = '匿名极客';
        let gameState = 'START'; // START, PLAYING, QUIZ, OVER
        let obstacles = [];
        let warnings = [];
        let particles = [];
        let hasRevived = false;
        let pendingQuizCorrect = false;
        let reachedMilestones = new Set();
        let usedQuizIndices = new Set();
        let spawnTimer = 0;
        let cameraOffset = 0;
        let bannerTimeout = null;
        let lastFrameTime = null;

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = rect.width;
            H = rect.height;
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            laneWidth = W / LANES;
            player.y = H - 145;
            player.targetX = getLaneX(player.lane);
            if (gameState === 'START') {
                player.x = player.targetX;
            }
        }
        window.addEventListener('resize', resize);

        document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
        document.addEventListener('contextmenu', e => e.preventDefault());

        function getLaneX(lane) {
            return laneWidth * lane + laneWidth / 2;
        }

        function startGame() {
            const inputName = document.getElementById('username').value.trim();
            if (!inputName) {
                alert('请先输入姓名或学号后四位，方便上榜排名哦！');
                return;
            }
            username = inputName;
            document.getElementById('player-tag').innerText = username;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('over-screen').classList.add('hidden');
            resetGame();
        }

        function resetGame() {
            score = 0;
            hasRevived = false;
            pendingQuizCorrect = false;
            reachedMilestones.clear();
            usedQuizIndices.clear();
            player.lane = 1;
            player.x = getLaneX(1);
            player.targetX = player.x;
            player.y = H - 145;
            player.scale = 1;
            player.lastJumpAt = 0;
            player.invulnUntil = 0;
            obstacles = [];
            warnings = [];
            particles = [];
            spawnTimer = 28;
            cameraOffset = 0;
            lastFrameTime = performance.now();
            gameState = 'PLAYING';
            updateScoreUI();
        }

        function restartGame() {
            document.getElementById('over-screen').classList.add('hidden');
            resetGame();
        }

        function backToStart() {
            document.getElementById('over-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            gameState = 'START';
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            const now = performance.now();
            if (now - player.lastJumpAt < 90) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;

            if (clickX < W / 2) {
                player.lane = Math.max(0, player.lane - 1);
            } else {
                player.lane = Math.min(LANES - 1, player.lane + 1);
            }
            player.targetX = getLaneX(player.lane);
            player.lastJumpAt = now;
            player.scale = 1.24;

            score += 10;
            cameraOffset = 16;
            updateScoreUI();
            checkMilestones();
            SoundFX.jump(player.lane);
            spawnParticles(player.x, player.y + 18, '#ff5555', 9);
        }, { passive: false });

        function checkMilestones() {
            for (const m of MILESTONES) {
                if (score >= m.height && !reachedMilestones.has(m.height)) {
                    reachedMilestones.add(m.height);
                    showMilestoneBanner(m.title);
                    SoundFX.milestone();
                    spawnParticles(player.x, player.y, '#ffd700', 22);
                }
            }
        }

        function showMilestoneBanner(text) {
            const el = document.getElementById('milestone-banner');
            el.innerText = text;
            el.classList.add('show');
            clearTimeout(bannerTimeout);
            bannerTimeout = setTimeout(() => {
                el.classList.remove('show');
            }, 1900);
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 7,
                    vy: Math.random() * 4.5 + 1.2,
                    life: 1,
                    color
                });
            }
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerText = score;
        }

        function scheduleObstacles() {
            const allLanes = [0, 1, 2];
            const primaryLane = Math.floor(Math.random() * LANES);
            const lanesToWarn = [primaryLane];

            if (score >= 300 && Math.random() < 0.34) {
                const others = allLanes.filter(l => l !== primaryLane);
                const secondLane = others[Math.floor(Math.random() * others.length)];
                lanesToWarn.push(secondLane);
            }

            const warnDuration = getWarnDuration(score);
            lanesToWarn.forEach((lane) => {
                warnings.push({
                    lane,
                    timer: warnDuration,
                    maxTimer: warnDuration
                });
            });
            SoundFX.warn();
        }

        function pickQuizIndex() {
            if (usedQuizIndices.size >= QUIZ_BANK.length) {
                usedQuizIndices.clear();
            }
            const available = [];
            for (let i = 0; i < QUIZ_BANK.length; i++) {
                if (!usedQuizIndices.has(i)) available.push(i);
            }
            const chosen = available[Math.floor(Math.random() * available.length)];
            usedQuizIndices.add(chosen);
            return chosen;
        }

        function triggerQuiz() {
            gameState = 'QUIZ';
            pendingQuizCorrect = false;

            const qIdx = pickQuizIndex();
            const qObj = QUIZ_BANK[qIdx];
            const explainEl = document.getElementById('quiz-explain');
            const nextBtn = document.getElementById('quiz-next-btn');

            explainEl.classList.remove('show');
            explainEl.innerHTML = '';
            nextBtn.classList.add('hidden');
            nextBtn.disabled = false;

            document.getElementById('quiz-question').innerText = qObj.q;
            const optBox = document.getElementById('quiz-options');
            optBox.innerHTML = '';

            let answered = false;
            qObj.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opt';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (answered) return;
                    answered = true;

                    const allOpts = optBox.querySelectorAll('.quiz-opt');
                    allOpts.forEach((el, i) => {
                        el.disabled = true;
                        if (i === qObj.ans) el.classList.add('correct');
                        else if (i === idx) el.classList.add('wrong');
                    });

                    const isRight = idx === qObj.ans;
                    pendingQuizCorrect = isRight;

                    explainEl.innerHTML = `
        <div style="font-weight:700; color:${isRight ? '#3fb950' : '#f85149'}; margin-bottom:4px;">
          ${isRight ? '✅ 回答正确！可复活并 +100m' : '❌ 回答有误！正确答案：' + qObj.opts[qObj.ans]}
        </div>
        <div>${escapeHtml(qObj.tip)}</div>
      `;
                    explainEl.classList.add('show');

                    nextBtn.innerText = isRight ? '下一步：复活继续 (+100m)' : '下一步：查看结算与排行';
                    nextBtn.classList.remove('hidden');
                };
                optBox.appendChild(btn);
            });

            document.getElementById('quiz-screen').classList.remove('hidden');
        }

        function handleQuizNext() {
            if (gameState !== 'QUIZ') return;
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-next-btn').classList.add('hidden');

            if (pendingQuizCorrect) {
                hasRevived = true;
                score += 100;
                updateScoreUI();
                checkMilestones();
                obstacles = [];
                warnings = [];
                player.invulnUntil = performance.now() + 900;
                lastFrameTime = performance.now();
                gameState = 'PLAYING';
                SoundFX.revive();
            } else {
                gameOver();
            }
        }

        function gameOver() {
            gameState = 'OVER';
            const isNewBest = saveScore(username, score);
            document.getElementById('over-title').innerText = '挑战结束';
            document.getElementById('final-score').innerText = score;
            document.getElementById('best-badge').innerText = isNewBest ? '🎉 刷新个人历史最高纪录！' : '';
            renderLeaderboard();
            document.getElementById('over-screen').classList.remove('hidden');
        }

        function showLeaderboard() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('over-screen').classList.remove('hidden');
            document.getElementById('over-title').innerText = '🏆 实时排行榜';
            document.getElementById('final-score').innerText = '-';
            document.getElementById('best-badge').innerText = '';
            renderLeaderboard();
        }

        // 【后端替换点】当前用 localStorage 模拟，上线可替换为 Supabase / 自建接口
        function saveScore(name, newScore) {
            let list = JSON.parse(localStorage.getItem('youth_game_rank') || '[]');
            const existing = list.find(item => item.name === name);
            let improved = false;
            if (existing) {
                if (newScore > existing.score) {
                    existing.score = newScore;
                    improved = true;
                }
            } else {
                list.push({ name, score: newScore });
                improved = newScore > 0;
            }
            list.sort((a, b) => b.score - a.score);
            localStorage.setItem('youth_game_rank', JSON.stringify(list.slice(0, 30)));
            return improved;
        }

        function renderLeaderboard() {
            const list = JSON.parse(localStorage.getItem('youth_game_rank') || '[]');
            const container = document.getElementById('rank-list');
            if (list.length === 0) {
                container.innerHTML = '<div style="color:#8b949e; padding:22px;">暂无成绩，快来抢占榜首！</div>';
                return;
            }
            container.innerHTML = list.map((item, index) => `
    <div class="rank-item">
      <span>#${index + 1} ${escapeHtml(item.name)}</span>
      <span>${item.score} m</span>
    </div>
  `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // ================= 主循环（dt 帧率归一化） =================
        function loop(now = performance.now()) {
            if (lastFrameTime === null) lastFrameTime = now;
            const rawDt = (now - lastFrameTime) / (1000 / 60);
            lastFrameTime = now;
            const dt = Math.min(Math.max(rawDt, 0.25), 2.5);

            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = '#212a3a';
            ctx.lineWidth = 2;
            for (let i = 1; i < LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, H);
                ctx.stroke();
            }

            cameraOffset *= Math.pow(0.84, dt);
            const stepGap = 64;
            const offset = (score * 5 + cameraOffset) % stepGap;
            ctx.strokeStyle = 'rgba(88, 166, 255, 0.09)';
            ctx.lineWidth = 1;
            for (let y = offset; y < H; y += stepGap) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            if (gameState === 'PLAYING') {
                const speedMult = getSpeedMultiplier(score);
                const interval = getSpawnInterval(score);
                spawnTimer += dt;
                if (spawnTimer >= interval) {
                    spawnTimer = 0;
                    scheduleObstacles();
                }

                for (let i = warnings.length - 1; i >= 0; i--) {
                    const w = warnings[i];
                    w.timer -= dt;
                    const wx = getLaneX(w.lane);
                    const pulse = 0.14 + Math.abs(Math.sin(w.timer * 0.28)) * 0.16;

                    ctx.fillStyle = `rgba(255, 85, 85, ${pulse})`;
                    ctx.fillRect(w.lane * laneWidth + 3, 0, laneWidth - 6, H);

                    ctx.fillStyle = '#ff6b6b';
                    ctx.font = 'bold 20px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚠️', wx, 108);

                    if (w.timer <= 0) {
                        const spec = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
                        obstacles.push({
                            lane: w.lane,
                            baseX: wx,
                            x: wx,
                            y: -30,
                            baseSpeed: (5.4 + Math.random() * 1.4) * spec.speedMult,
                            label: spec.label,
                            color: spec.color,
                            width: spec.width,
                            wobble: spec.wobble,
                            phase: Math.random() * Math.PI * 2
                        });
                        warnings.splice(i, 1);
                    }
                }

                const isInvuln = now < player.invulnUntil;
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.y += obs.baseSpeed * speedMult * dt;
                    obs.phase += 0.12 * dt;
                    if (obs.wobble > 0) {
                        const maxShift = (laneWidth - obs.width) * 0.35;
                        obs.x = obs.baseX + Math.sin(obs.phase) * Math.min(maxShift, obs.wobble * 6);
                    }

                    ctx.fillStyle = obs.color;
                    ctx.beginPath();
                    ctx.roundRect(obs.x - obs.width / 2, obs.y - 20, obs.width, 40, 8);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 13px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(obs.label, obs.x, obs.y + 5);

                    if (!isInvuln && obs.lane === player.lane && Math.abs(obs.y - player.y) < 34) {
                        SoundFX.hit();
                        spawnParticles(player.x, player.y, '#ff5555', 18);
                        if (!hasRevived) {
                            triggerQuiz();
                        } else {
                            gameOver();
                        }
                        break;
                    }

                    if (obs.y > H + 55) obstacles.splice(i, 1);
                }
            }

            player.x += (player.targetX - player.x) * (1 - Math.pow(0.62, dt));
            player.scale += (1 - player.scale) * (1 - Math.pow(0.78, dt));

            const blinkSkip = gameState === 'PLAYING' && now < player.invulnUntil && Math.floor(now / 80) % 2 === 0;
            if (!blinkSkip) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.scale(player.scale, player.scale);

                ctx.fillStyle = '#ff5555';
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 215, 0, 0.55)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#ffd700';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('★', 0, 6);
                ctx.restore();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= 0.045 * dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillRect(p.x - 2.5, p.y - 2.5, 5, 5);
                ctx.globalAlpha = 1;
            }

            requestAnimationFrame(loop);
        }

        resize();
        requestAnimationFrame(loop);
    </script>
</body>
